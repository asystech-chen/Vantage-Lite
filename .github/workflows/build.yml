name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build VantageLite.csproj -c Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VantageLite-${{ github.sha }}
          path: bin/Release/net48/VantageLite.exe
          if-no-files-found: error
